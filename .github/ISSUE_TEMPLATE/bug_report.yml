name: Bug Report
description: Report a reproducible problem or unexpected behavior in Arkon
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System Environment
      description: |
        Please include:
        - Arkon version (`arkon version`)
        - OS & Kernel (`uname -a`)
        - Systemd version (`systemctl --version`)
        - Hardware platform (CPU, motherboard, RTC chip)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps or configuration needed to trigger the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output
      description: Terminal output, journalctl logs (`journalctl -u arkon-sleep`), or error messages.
      render: shell

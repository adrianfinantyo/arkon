name: Feature Request
description: Propose a new feature, hardware abstraction, or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for improving Arkon.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What challenge or limitation are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should Arkon address this? Describe CLI syntax, config parameters, or workflow changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Are there other tools or workarounds you currently use?
